<nav class="site-nav">
  <ul>
    {% for item in site.navigation %}
      <li>
        <a href="{{ item.url | relative_url }}" {% if page.url == item.url or (item.url == '/' and page.url == '/index.html') %}class="active"{% endif %}>
          {{ item.title }}
        </a>
      </li>
    {% endfor %}
  </ul>
</nav>
